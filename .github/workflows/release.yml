name: Release

on:
  push:
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    name: Release copyfu
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Check version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "$version" = "${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: |
          pnpm install

      - name: Generate a changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Zip extensions
        run: |
          pnpm run zip
          pnpm run zip:firefox

      - name: Create Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
              --title "v${GITHUB_REF_NAME}" \
              --notes "${RELEASE_NOTES}" \
              .output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.git-cliff.outputs.content }}
